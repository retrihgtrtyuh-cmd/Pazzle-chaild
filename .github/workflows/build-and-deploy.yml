name: Build & Deploy Android APK to Telegram

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      notes:
        description: 'Комментарий к сборке'
        required: false
        default: 'Автоматическая сборка APK'

jobs:
  build-and-deploy:
    name: Build Android APK & Send to Telegram
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Restore Keystore (.jks) if configured
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ "$KEYSTORE_BASE64" != "-" ]; then
            mkdir -p app
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release-key.jks
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "has_keystore=false" >> $GITHUB_OUTPUT
          fi

      - name: Build APK with Gradle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ steps.keystore.outputs.has_keystore }}" = "true" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=$(pwd)/app/release-key.jks \
              -Pandroid.injected.signing.store.password="${KEYSTORE_PASSWORD}" \
              -Pandroid.injected.signing.key.alias="${KEY_ALIAS}" \
              -Pandroid.injected.signing.key.password="${KEY_PASSWORD}" || ./gradlew assembleDebug
          else
            ./gradlew assembleRelease || ./gradlew assembleDebug
          fi

      - name: Locate compiled APK & Commit Info
        id: locate_apk
        run: |
          APK_FILE=$(find . -path "*/build/outputs/apk/*" -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::Файл APK не найден в build/outputs/apk/"
            exit 1
          fi
          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "commit_msg=$(git log -1 --pretty=format:'%s')" >> $GITHUB_OUTPUT
          echo "author=$(git log -1 --pretty=format:'%an')" >> $GITHUB_OUTPUT

      - name: Send APK to Telegram
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APK_PATH: ${{ steps.locate_apk.outputs.apk_path }}
          SHORT_SHA: ${{ steps.locate_apk.outputs.short_sha }}
          COMMIT_MSG: ${{ steps.locate_apk.outputs.commit_msg }}
          AUTHOR: ${{ steps.locate_apk.outputs.author }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          CAPTION="📦 <b>Сборка APK (#${RUN_NUM}) готова!</b>%0A%0A• <b>Проект:</b> <code>${{ github.repository }}</code>%0A• <b>Ветка:</b> <code>${{ github.ref_name }}</code>%0A• <b>Коммит:</b> <code>${SHORT_SHA}</code> — ${COMMIT_MSG}%0A• <b>Автор:</b> ${AUTHOR}"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "parse_mode=HTML" \
            -F "caption=${CAPTION}" \
            -F "document=@${APK_PATH}"

      - name: Cleanup Keystore
        if: always()
        run: rm -f app/release-key.jks
